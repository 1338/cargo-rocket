[package]
name = "cargo-rocket"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A small, self-hosted upload service with an S3-style flow and pluggable storage."
authors = ["Max van der Sluis <maxvandersluis@yahoo.com>"]
license = "MIT"
repository = "https://github.com/1338/cargo-rocket"
readme = "README.md"
keywords = ["upload", "storage", "s3", "self-hosted", "axum"]
categories = ["web-programming::http-server", "filesystem"]
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
opendal = { version = "0.54.1", features = ["services-fs", "services-s3", "services-azblob", "services-ftp", "services-sftp"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
